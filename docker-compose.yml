services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: streamscout-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: twitch
      POSTGRES_USER: twitch
      POSTGRES_PASSWORD: twitch_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitch -d twitch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamscout

  redis:
    image: redis:7-alpine
    container_name: streamscout-redis
    restart: unless-stopped
    profiles:
      - local-db
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamscout

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamscout-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # KRaft cluster ID (generated once, keep stable)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - streamscout

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamscout-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # chat-messages was 20 partitions against FLINK_PARALLELISM=4 (see
    # clip_detector_job.py) -- far more partitions than concurrent
    # broadcasters (15-30, hysteresis band in stream_monitoring_service.py),
    # so most partitions carried 0-1 broadcasters at any moment. A partition
    # that idle freezes its subtask's watermark (the minimum across its
    # partitions), which freezes the *operator* watermark (the minimum
    # across subtasks) for every broadcaster, not just the quiet one --
    # KNOWN_ISSUES.md Issue 4. 4 partitions matches today's parallelism
    # exactly; re-provision together with parallelism if either changes.
    #
    # --if-not-exists will NOT shrink an existing 20-partition topic --
    # Kafka can only grow a topic's partition count in place, never shrink
    # it. Deploying this requires deleting the live `chat-messages` topic
    # before the next restart so this command creates it fresh at 4;
    # otherwise the config here silently stops matching reality.
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stream-lifecycle --partitions 10 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic chat-messages --partitions 4 --replication-factor 1 --config retention.ms=3600000
      echo 'Kafka topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - streamscout

  # =============================================================================
  # Apache Flink Cluster
  # =============================================================================

  flink-jobmanager:
    build:
      context: ./services/flink-job
      dockerfile: Dockerfile
    container_name: streamscout-flink-jobmanager
    restart: unless-stopped
    command: /opt/flink/docker-entrypoint-job.sh
    ports:
      - "8081:8081"
      - "9249:9249"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=twitch
      - POSTGRES_USER=twitch
      - POSTGRES_PASSWORD=twitch_password
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_TOKEN_FILE=/opt/flink/secrets/twitch_user_tokens.json
      - TWITCH_TOKEN_GID=9999
      # The -pyFiles argument for the job, read by docker-entrypoint-job.sh.
      # Kept here, not hardcoded in that script, so a new module needs only
      # this line and a bind-mount entry below, not an image rebuild.
      - FLINK_PYFILES=/opt/flink/usrlib/spike_detector.py,/opt/flink/usrlib/token_manager.py,/opt/flink/usrlib/clip_attempt.py
      - DETECTION_WINDOW_SECONDS=5
      # Back to the first design value of 5 minutes (Plan 06 step 12). Commit
      # c7afdab was a frontend change. It decreased this to 10 and did not
      # restore it. The cost is a warm-up of approximately 4 minutes per
      # channel (DETECTION_MIN_BASELINE_FRACTION x this value).
      #
      # The join/leave hysteresis in stream-monitoring (JOIN_THRESHOLD 15,
      # LEAVE_THRESHOLD 30) helps here, but it does not remove the cost. Those
      # thresholds are ranks, not times. They stop a channel near the rank
      # boundary from leaving and rejoining. They do not guarantee that any
      # channel stays monitored for 4 minutes. A channel that enters the top 15
      # and leaves the top 30 within 4 minutes produces no detections. Plan 06
      # Phase 4 step 22 found no such channel in 12 hours: the shortest
      # unbroken appearance was 410 seconds, against a gate of 240.
      - DETECTION_BASELINE_SECONDS=300
      # The trigger, in standard deviations above the baseline mean.
      # DetectorConfig reads this into its field `k`. The variable keeps its
      # first name, because spec 002 FR-001b uses that name.
      #
      # Plan 06 Phase 4 step 18 set this value from the 12-hour corpus. 4.0 is
      # the 99.71st percentile of 840,225 per-second readings. The tool took
      # those readings with the trigger off, so nothing removed part of the
      # distribution. The result is 516 detections in 12 hours. That is 2.2
      # for each broadcaster-hour, across 61 of the 72 broadcasters. The
      # median detection is a burst 6.4 times the resting rate of its channel.
      # The earlier value of 5.0 came from the formula that Phase 3 deleted.
      # See DetectorConfig in services/flink-job/spike_detector.py.
      #
      # This does NOT set the 7 / 9 / 11 display levels in the frontend, or
      # DEFAULT_MIN_INTENSITY = 9.0 in api_frontend_service.py. On this scale
      # 9.0 is the 99.99th percentile. That default filter thus hides almost
      # every clip. Phase 6 must correct it.
      - DETECTION_STD_DEV_THRESHOLD=4.0
      # The maximum length of one elevated period, before the detector reports
      # a result. Plan 06 Phase 4 step 19 measured real periods with no cap.
      # The median is 2 seconds, the 99th percentile is 14, and the longest in
      # 12 hours is 24. A cap of 25 thus cuts short no period. Use the
      # smallest cap that cuts short no period, and not a large one. The cap
      # sets the maximum distance between the peak and the clip request. The
      # earlier value of 60 was a placeholder.
      - DETECTION_HOLD_CAP_SECONDS=25
      # How long the detector must watch a channel before it reports anything,
      # as a fraction of DETECTION_BASELINE_SECONDS. This gate measures elapsed
      # observation time, not how busy the channel is.
      #
      # Plan 06 Phase 4 step 22 measured it. 0.8 blocks 2.22% of the evaluated
      # seconds. Each value from 0.5 to 0.9 stays within 5 detections of it.
      # Do not set this to 1.0. observed_seconds reaches the full 300 only
      # when a message is in the single oldest baseline second. 1.0 thus
      # becomes a test of bucket density. It blocks 39.9% of the seconds,
      # against 2.7% at 0.9. DetectorConfig rejects 1.0 at start-up.
      - DETECTION_MIN_BASELINE_FRACTION=0.8
      # Plan 06 Phase 4 step 20 measured the interval between periods with
      # this value at zero. 22.7% of the adjacent pairs are less than 3
      # seconds apart. Each of those is one reaction that moves across the
      # trigger more than one time. 61.2% are more than 300 seconds apart, and
      # those are separate events. Only 2.7% are between 10 and 30, so 30
      # removes few real events. The value stays at 30 on purpose. Plan 06
      # keeps it at 30 for now, so that this phase changes one thing only.
      - DETECTION_COOLDOWN_SECONDS=30
    volumes:
      - ./secrets:/opt/flink/secrets:rw
      - ./services/flink-job/clip_detector_job.py:/opt/flink/usrlib/clip_detector_job.py:ro
      - ./services/flink-job/clip_attempt.py:/opt/flink/usrlib/clip_attempt.py:ro
      - ./services/flink-job/spike_detector.py:/opt/flink/usrlib/spike_detector.py:ro
      - ./services/flink-job/token_manager.py:/opt/flink/usrlib/token_manager.py:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # Checks that the job is RUNNING, not just that the REST endpoint
      # answers. Those are not the same thing: Flink's REST server starts
      # as part of general cluster bootstrap, before
      # ApplicationDispatcherBootstrap runs the job's own main(). Checking
      # /overview alone could report healthy in the gap between those two
      # events, or in the instant after the job fails and before the
      # container exits.
      #
      # Checking for the job's name is not enough either -- a FAILED or
      # CANCELED job still appears in /jobs/overview under its own name.
      # python3 (already in this image) parses the state field directly,
      # rather than a grep pattern that would also need to assume a field
      # order the REST API does not guarantee.
      test:
        - "CMD-SHELL"
        - |
          curl -sf http://localhost:8081/jobs/overview | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          sys.exit(0 if any(j.get('name') == 'Clip Detector Job' and j.get('state') == 'RUNNING' for j in d.get('jobs', [])) else 1)
          "
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks:
      - streamscout

  flink-taskmanager:
    build:
      context: ./services/flink-job
      dockerfile: Dockerfile
    container_name: streamscout-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    ports:
      # 9250-9253: one clip-detector metrics port per parallel subtask
      # (must span taskmanager.numberOfTaskSlots below, one port each)
      - "9250:9250"
      - "9251:9251"
      - "9252:9252"
      - "9253:9253"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        # Keep in step with services/flink-job/flink-conf.yaml -- these two
        # values are duplicated and drift silently if only one is edited.
        # Raised from 2048m: the TaskManager rested at ~73% of that cap at
        # only ~30 broadcasters, and hashmap state grows with broadcaster
        # count. See specs/003-detector-scale-fanout/research.md.
        taskmanager.memory.process.size: 6144m
        taskmanager.numberOfTaskSlots: 4
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=twitch
      - POSTGRES_USER=twitch
      - POSTGRES_PASSWORD=twitch_password
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_TOKEN_FILE=/opt/flink/secrets/twitch_user_tokens.json
      - TWITCH_TOKEN_GID=9999
      - METRICS_PORT=9250
      - DETECTION_WINDOW_SECONDS=5
      # Back to the first design value of 5 minutes (Plan 06 step 12). Commit
      # c7afdab was a frontend change. It decreased this to 10 and did not
      # restore it. The cost is a warm-up of approximately 4 minutes per
      # channel (DETECTION_MIN_BASELINE_FRACTION x this value).
      #
      # The join/leave hysteresis in stream-monitoring (JOIN_THRESHOLD 15,
      # LEAVE_THRESHOLD 30) helps here, but it does not remove the cost. Those
      # thresholds are ranks, not times. They stop a channel near the rank
      # boundary from leaving and rejoining. They do not guarantee that any
      # channel stays monitored for 4 minutes. A channel that enters the top 15
      # and leaves the top 30 within 4 minutes produces no detections. Plan 06
      # Phase 4 step 22 found no such channel in 12 hours: the shortest
      # unbroken appearance was 410 seconds, against a gate of 240.
      - DETECTION_BASELINE_SECONDS=300
      # The trigger, in standard deviations above the baseline mean.
      # DetectorConfig reads this into its field `k`. The variable keeps its
      # first name, because spec 002 FR-001b uses that name.
      #
      # Plan 06 Phase 4 step 18 set this value from the 12-hour corpus. 4.0 is
      # the 99.71st percentile of 840,225 per-second readings. The tool took
      # those readings with the trigger off, so nothing removed part of the
      # distribution. The result is 516 detections in 12 hours. That is 2.2
      # for each broadcaster-hour, across 61 of the 72 broadcasters. The
      # median detection is a burst 6.4 times the resting rate of its channel.
      # The earlier value of 5.0 came from the formula that Phase 3 deleted.
      # See DetectorConfig in services/flink-job/spike_detector.py.
      #
      # This does NOT set the 7 / 9 / 11 display levels in the frontend, or
      # DEFAULT_MIN_INTENSITY = 9.0 in api_frontend_service.py. On this scale
      # 9.0 is the 99.99th percentile. That default filter thus hides almost
      # every clip. Phase 6 must correct it.
      - DETECTION_STD_DEV_THRESHOLD=4.0
      # The maximum length of one elevated period, before the detector reports
      # a result. Plan 06 Phase 4 step 19 measured real periods with no cap.
      # The median is 2 seconds, the 99th percentile is 14, and the longest in
      # 12 hours is 24. A cap of 25 thus cuts short no period. Use the
      # smallest cap that cuts short no period, and not a large one. The cap
      # sets the maximum distance between the peak and the clip request. The
      # earlier value of 60 was a placeholder.
      - DETECTION_HOLD_CAP_SECONDS=25
      # How long the detector must watch a channel before it reports anything,
      # as a fraction of DETECTION_BASELINE_SECONDS. This gate measures elapsed
      # observation time, not how busy the channel is.
      #
      # Plan 06 Phase 4 step 22 measured it. 0.8 blocks 2.22% of the evaluated
      # seconds. Each value from 0.5 to 0.9 stays within 5 detections of it.
      # Do not set this to 1.0. observed_seconds reaches the full 300 only
      # when a message is in the single oldest baseline second. 1.0 thus
      # becomes a test of bucket density. It blocks 39.9% of the seconds,
      # against 2.7% at 0.9. DetectorConfig rejects 1.0 at start-up.
      - DETECTION_MIN_BASELINE_FRACTION=0.8
      # Plan 06 Phase 4 step 20 measured the interval between periods with
      # this value at zero. 22.7% of the adjacent pairs are less than 3
      # seconds apart. Each of those is one reaction that moves across the
      # trigger more than one time. 61.2% are more than 300 seconds apart, and
      # those are separate events. Only 2.7% are between 10 and 30, so 30
      # removes few real events. The value stays at 30 on purpose. Plan 06
      # keeps it at 30 for now, so that this phase changes one thing only.
      - DETECTION_COOLDOWN_SECONDS=30
      # How long to wait after a detection before the clip request. This was
      # 10 seconds, which was correct for the earlier detector: that one
      # reported at the start of a spike, and the wait moved the clip window
      # forward onto the moment. Plan 06 Phase 3 moved the report to the end of
      # the spike, so the same wait moved the window past the moment.
      #
      # Measured on the 12-hour corpus. At 10 seconds the clip covered -9.9 to
      # +20.1 seconds around the report, and 6 of 516 clips did not contain
      # their own peak. At 0 the clip covers -19.9 to +10.1 seconds, all 516
      # contain their peak, and the median peak sits 60% through the clip
      # instead of 26%. See ClipPolicy in services/flink-job/clip_attempt.py.
      - CLIP_INITIAL_DELAY_SECONDS=0
      - CLIP_CREATE_RETRY_DELAYS=0,2,4
      - CLIP_METADATA_RETRY_DELAYS=5,10,15,30
    volumes:
      - ./secrets:/opt/flink/secrets:rw
      - ./services/flink-job/clip_detector_job.py:/opt/flink/usrlib/clip_detector_job.py:ro
      - ./services/flink-job/clip_attempt.py:/opt/flink/usrlib/clip_attempt.py:ro
      - ./services/flink-job/spike_detector.py:/opt/flink/usrlib/spike_detector.py:ro
      - ./services/flink-job/token_manager.py:/opt/flink/usrlib/token_manager.py:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    networks:
      - streamscout

  # =============================================================================
  # Application Services
  # =============================================================================

  stream-monitoring:
    build:
      context: ./services/stream-monitoring
      dockerfile: Dockerfile
    container_name: streamscout-stream-monitoring
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9100:9100"
    environment:
      - KAFKA_BROKER_URL=kafka:29092
      - POSTGRES_URL=postgresql://twitch:twitch_password@postgres:5432/twitch
      - REDIS_URL=redis://redis:6379
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      # Scopes this service needs on the token, seeded by
      # seed_twitch_tokens.py REQUIRED_SCOPES:
      #   user:read:chat -- EventSub channel.chat.message (the chat transport)
      #   clips:edit     -- clip creation, shared with the Flink job
      # A token without user:read:chat makes every chat subscription refuse;
      # the service logs that at ERROR on start-up rather than going quiet.
      - TWITCH_TOKEN_FILE=/app/secrets/twitch_user_tokens.json
      - TWITCH_TOKEN_GID=9999
      - PROMETHEUS_PORT=9100
      - HEALTH_CHECK_PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - ./secrets:/app/secrets:rw
      - ./services/stream-monitoring/stream_monitoring_service.py:/app/stream_monitoring_service.py:ro
      - ./services/stream-monitoring/reconciler.py:/app/reconciler.py:ro
      - ./services/stream-monitoring/eventsub_pool.py:/app/eventsub_pool.py:ro
      - ./services/stream-monitoring/token_manager.py:/app/token_manager.py:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - streamscout

  api-frontend:
    build:
      context: ./services/api-frontend
      dockerfile: Dockerfile
    container_name: streamscout-api-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_URL=postgresql://twitch:twitch_password@postgres:5432/twitch
      - HTTP_PORT=5000
      - LOG_LEVEL=INFO
    volumes:
      - ./services/api-frontend/static:/app/static:ro
      - ./services/api-frontend/api_frontend_service.py:/app/api_frontend_service.py:ro
      - ./services/api-frontend/gunicorn.conf.py:/app/gunicorn.conf.py:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - streamscout

  # =============================================================================
  # Monitoring & Observability
  # =============================================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: streamscout-node-exporter
    restart: unless-stopped
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - streamscout

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: streamscout-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    networks:
      - streamscout

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: streamscout-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - streamscout

  loki:
    image: grafana/loki:2.9.0
    container_name: streamscout-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - streamscout

  promtail:
    image: grafana/promtail:2.9.0
    container_name: streamscout-promtail
    restart: unless-stopped
    volumes:
      - ./configs/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - streamscout

  grafana:
    image: grafana/grafana:10.2.0
    container_name: streamscout-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - streamscout

networks:
  streamscout:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
