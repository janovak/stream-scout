services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: streamscout-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: twitch
      POSTGRES_USER: twitch
      POSTGRES_PASSWORD: twitch_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitch -d twitch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamscout

  redis:
    image: redis:7-alpine
    container_name: streamscout-redis
    restart: unless-stopped
    profiles:
      - local-db
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamscout

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamscout-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # KRaft cluster ID (generated once, keep stable)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - streamscout

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamscout-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stream-lifecycle --partitions 10 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic chat-messages --partitions 20 --replication-factor 1 --config retention.ms=3600000
      echo 'Kafka topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - streamscout

  # =============================================================================
  # Apache Flink Cluster
  # =============================================================================

  flink-jobmanager:
    build:
      context: ./services/flink-job
      dockerfile: Dockerfile
    container_name: streamscout-flink-jobmanager
    restart: unless-stopped
    command: /opt/flink/docker-entrypoint-job.sh
    ports:
      - "8081:8081"
      - "9249:9249"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=twitch
      - POSTGRES_USER=twitch
      - POSTGRES_PASSWORD=twitch_password
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_TOKEN_FILE=/opt/flink/secrets/twitch_user_tokens.json
      - DETECTION_WINDOW_SECONDS=5
      # Back to the first design value of 5 minutes (Plan 06 step 12). Commit
      # c7afdab was a frontend change. It decreased this to 10 and did not
      # restore it. The cost is a warm-up of approximately 4 minutes per
      # channel (DETECTION_MIN_BASELINE_FRACTION x this value).
      #
      # The join/leave hysteresis in stream-monitoring (JOIN_THRESHOLD 15,
      # LEAVE_THRESHOLD 30) helps here, but it does not remove the cost. Those
      # thresholds are ranks, not times. They stop a channel near the rank
      # boundary from leaving and rejoining. They do not guarantee that any
      # channel stays monitored for 4 minutes. A channel that enters the top 15
      # and leaves the top 30 within 4 minutes produces no detections. Plan 06
      # Phase 4 step 22 found no such channel in 12 hours: the shortest
      # unbroken appearance was 410 seconds, against a gate of 240.
      - DETECTION_BASELINE_SECONDS=300
      # The trigger, in standard deviations above the baseline mean.
      # DetectorConfig reads this into its field `k`. The variable keeps its
      # first name, because spec 002 FR-001b uses that name.
      #
      # Plan 06 Phase 4 step 18 set this from the 12-hour corpus: 4.0 is the
      # 99.71st percentile of 840,225 per-second readings, taken with the
      # trigger disabled so nothing censored the distribution. It gives 516
      # detections in 12 hours, 2.2 per broadcaster-hour, across 61 of 72
      # broadcasters, and the median one is a burst 6.4x the channel's own
      # resting rate. The earlier 5.0 came from the formula Phase 3 deleted.
      # See DetectorConfig in services/flink-job/spike_detector.py.
      #
      # Still open, and NOT settled by this: the 7 / 9 / 11 display levels in
      # the frontend, and DEFAULT_MIN_INTENSITY = 9.0 in
      # api_frontend_service.py. On this scale 9.0 is the 99.99th percentile,
      # so that default filter hides almost every clip. Blocked on Phase 6.
      - DETECTION_STD_DEV_THRESHOLD=4.0
      # The maximum length of one elevated period, before the detector reports
      # a result. Plan 06 Phase 4 step 19 measured real periods with no cap:
      # median 2 seconds, p99 14, longest in 12 hours 24. A cap of 25 truncates
      # none of them. It is deliberately the smallest value that truncates
      # nothing rather than a generous one, because the cap bounds how far the
      # reported peak can sit behind the clip request. The earlier 60 was a
      # placeholder.
      - DETECTION_HOLD_CAP_SECONDS=25
      # How long the detector must watch a channel before it reports anything,
      # as a fraction of DETECTION_BASELINE_SECONDS. This gate measures elapsed
      # observation time, not how busy the channel is.
      #
      # Plan 06 Phase 4 step 22 measured it. 0.8 blocks 2.22% of evaluated
      # seconds; anything from 0.5 to 0.9 lands within 5 detections of it. Do
      # not set this to 1.0: observed_seconds only reaches the full 300 when a
      # message lands in the single oldest baseline second, so 1.0 becomes a
      # bucket-density test and blocks 39.9% of seconds against 2.7% at 0.9.
      - DETECTION_MIN_BASELINE_FRACTION=0.8
      # Plan 06 Phase 4 step 20 measured the gap between periods with this
      # disabled: 22.7% of consecutive pairs are under 3 seconds apart (one
      # reaction flickering across the trigger) and 61.2% are over 300 apart
      # (separate events). Only 2.7% fall between 10 and 30, so 30 swallows
      # few real events. Left unchanged on purpose -- Plan 06 keeps it at 30
      # "for now" so that this phase changes one thing at a time.
      - DETECTION_COOLDOWN_SECONDS=30
    volumes:
      - ./secrets:/opt/flink/secrets:rw
      - ./services/flink-job/clip_detector_job.py:/opt/flink/usrlib/clip_detector_job.py:ro
      - ./services/flink-job/clip_attempt.py:/opt/flink/usrlib/clip_attempt.py:ro
      - ./services/flink-job/spike_detector.py:/opt/flink/usrlib/spike_detector.py:ro
      - ./services/flink-job/token_manager.py:/opt/flink/usrlib/token_manager.py:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
    networks:
      - streamscout

  flink-taskmanager:
    build:
      context: ./services/flink-job
      dockerfile: Dockerfile
    container_name: streamscout-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    ports:
      # 9250-9253: one clip-detector metrics port per parallel subtask
      # (must span taskmanager.numberOfTaskSlots below, one port each)
      - "9250:9250"
      - "9251:9251"
      - "9252:9252"
      - "9253:9253"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=twitch
      - POSTGRES_USER=twitch
      - POSTGRES_PASSWORD=twitch_password
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_TOKEN_FILE=/opt/flink/secrets/twitch_user_tokens.json
      - METRICS_PORT=9250
      - DETECTION_WINDOW_SECONDS=5
      # Back to the first design value of 5 minutes (Plan 06 step 12). Commit
      # c7afdab was a frontend change. It decreased this to 10 and did not
      # restore it. The cost is a warm-up of approximately 4 minutes per
      # channel (DETECTION_MIN_BASELINE_FRACTION x this value).
      #
      # The join/leave hysteresis in stream-monitoring (JOIN_THRESHOLD 15,
      # LEAVE_THRESHOLD 30) helps here, but it does not remove the cost. Those
      # thresholds are ranks, not times. They stop a channel near the rank
      # boundary from leaving and rejoining. They do not guarantee that any
      # channel stays monitored for 4 minutes. A channel that enters the top 15
      # and leaves the top 30 within 4 minutes produces no detections. Plan 06
      # Phase 4 step 22 found no such channel in 12 hours: the shortest
      # unbroken appearance was 410 seconds, against a gate of 240.
      - DETECTION_BASELINE_SECONDS=300
      # The trigger, in standard deviations above the baseline mean.
      # DetectorConfig reads this into its field `k`. The variable keeps its
      # first name, because spec 002 FR-001b uses that name.
      #
      # Plan 06 Phase 4 step 18 set this from the 12-hour corpus: 4.0 is the
      # 99.71st percentile of 840,225 per-second readings, taken with the
      # trigger disabled so nothing censored the distribution. It gives 516
      # detections in 12 hours, 2.2 per broadcaster-hour, across 61 of 72
      # broadcasters, and the median one is a burst 6.4x the channel's own
      # resting rate. The earlier 5.0 came from the formula Phase 3 deleted.
      # See DetectorConfig in services/flink-job/spike_detector.py.
      #
      # Still open, and NOT settled by this: the 7 / 9 / 11 display levels in
      # the frontend, and DEFAULT_MIN_INTENSITY = 9.0 in
      # api_frontend_service.py. On this scale 9.0 is the 99.99th percentile,
      # so that default filter hides almost every clip. Blocked on Phase 6.
      - DETECTION_STD_DEV_THRESHOLD=4.0
      # The maximum length of one elevated period, before the detector reports
      # a result. Plan 06 Phase 4 step 19 measured real periods with no cap:
      # median 2 seconds, p99 14, longest in 12 hours 24. A cap of 25 truncates
      # none of them. It is deliberately the smallest value that truncates
      # nothing rather than a generous one, because the cap bounds how far the
      # reported peak can sit behind the clip request. The earlier 60 was a
      # placeholder.
      - DETECTION_HOLD_CAP_SECONDS=25
      # How long the detector must watch a channel before it reports anything,
      # as a fraction of DETECTION_BASELINE_SECONDS. This gate measures elapsed
      # observation time, not how busy the channel is.
      #
      # Plan 06 Phase 4 step 22 measured it. 0.8 blocks 2.22% of evaluated
      # seconds; anything from 0.5 to 0.9 lands within 5 detections of it. Do
      # not set this to 1.0: observed_seconds only reaches the full 300 when a
      # message lands in the single oldest baseline second, so 1.0 becomes a
      # bucket-density test and blocks 39.9% of seconds against 2.7% at 0.9.
      - DETECTION_MIN_BASELINE_FRACTION=0.8
      # Plan 06 Phase 4 step 20 measured the gap between periods with this
      # disabled: 22.7% of consecutive pairs are under 3 seconds apart (one
      # reaction flickering across the trigger) and 61.2% are over 300 apart
      # (separate events). Only 2.7% fall between 10 and 30, so 30 swallows
      # few real events. Left unchanged on purpose -- Plan 06 keeps it at 30
      # "for now" so that this phase changes one thing at a time.
      - DETECTION_COOLDOWN_SECONDS=30
      - CLIP_INITIAL_DELAY_SECONDS=10
      - CLIP_CREATE_RETRY_DELAYS=0,2,4
      - CLIP_METADATA_RETRY_DELAYS=5,10,15,30
    volumes:
      - ./secrets:/opt/flink/secrets:rw
      - ./services/flink-job/clip_detector_job.py:/opt/flink/usrlib/clip_detector_job.py:ro
      - ./services/flink-job/clip_attempt.py:/opt/flink/usrlib/clip_attempt.py:ro
      - ./services/flink-job/spike_detector.py:/opt/flink/usrlib/spike_detector.py:ro
      - ./services/flink-job/token_manager.py:/opt/flink/usrlib/token_manager.py:ro
    depends_on:
      - flink-jobmanager
    networks:
      - streamscout

  # =============================================================================
  # Application Services
  # =============================================================================

  stream-monitoring:
    build:
      context: ./services/stream-monitoring
      dockerfile: Dockerfile
    container_name: streamscout-stream-monitoring
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9100:9100"
    environment:
      - KAFKA_BROKER_URL=kafka:29092
      - POSTGRES_URL=postgresql://twitch:twitch_password@postgres:5432/twitch
      - REDIS_URL=redis://redis:6379
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_TOKEN_FILE=/app/secrets/twitch_user_tokens.json
      - PROMETHEUS_PORT=9100
      - HEALTH_CHECK_PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - ./secrets:/app/secrets:rw
      - ./services/stream-monitoring/stream_monitoring_service.py:/app/stream_monitoring_service.py:ro
      - ./services/stream-monitoring/token_manager.py:/app/token_manager.py:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - streamscout

  api-frontend:
    build:
      context: ./services/api-frontend
      dockerfile: Dockerfile
    container_name: streamscout-api-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_URL=postgresql://twitch:twitch_password@postgres:5432/twitch
      - HTTP_PORT=5000
      - LOG_LEVEL=INFO
    volumes:
      - ./services/api-frontend/static:/app/static:ro
      - ./services/api-frontend/api_frontend_service.py:/app/api_frontend_service.py:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - streamscout

  # =============================================================================
  # Monitoring & Observability
  # =============================================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: streamscout-node-exporter
    restart: unless-stopped
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - streamscout

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: streamscout-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    networks:
      - streamscout

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: streamscout-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - streamscout

  loki:
    image: grafana/loki:2.9.0
    container_name: streamscout-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - streamscout

  promtail:
    image: grafana/promtail:2.9.0
    container_name: streamscout-promtail
    restart: unless-stopped
    volumes:
      - ./configs/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - streamscout

  grafana:
    image: grafana/grafana:10.2.0
    container_name: streamscout-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - streamscout

networks:
  streamscout:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
