# Flink Configuration for Clip Detector Job

jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1024m

# Measured 2026-08-27: the TaskManager sat at ~1.47 GiB of a 2048m cap (~73%)
# while watching only ~30 broadcasters. state.backend is hashmap and
# checkpointing is off, so all keyed state lives on the JVM heap and grows
# with the broadcaster count. Scaling toward 2000 broadcasters against a 73%
# resting utilisation would have hit this ceiling well before any detector
# cost mattered. The host has 15 GiB total with ~5.2 GiB free, so this
# headroom is already paid for.
# See specs/003-detector-scale-fanout/research.md.
taskmanager.memory.process.size: 6144m
taskmanager.numberOfTaskSlots: 4

parallelism.default: 4

# Disable checkpointing (hobby project - rebuild from Kafka on restart)
# Note: Setting to 0 is invalid, so we simply omit the config to disable checkpointing

# State backend
state.backend: hashmap

# Metrics
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249

# REST & Web UI
rest.address: 0.0.0.0
rest.port: 8081
web.submit.enable: true

# Logging
env.log.dir: /opt/flink/log
