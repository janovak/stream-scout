groups:
  - name: infrastructure
    rules:
      # Kafka consumer lag alert
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumer_group }} has lag of {{ $value }} on topic {{ $labels.topic }}"

      # Flink TaskManager down
      - alert: FlinkTaskManagerDown
        expr: up{job="flink-taskmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Flink TaskManager is down"
          description: "Flink TaskManager has been unreachable for more than 2 minutes"

      # Flink JobManager down
      - alert: FlinkJobManagerDown
        expr: up{job="flink-jobmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Flink JobManager is down"
          description: "Flink JobManager has been unreachable for more than 2 minutes"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      # Stream monitoring service down
      - alert: StreamMonitoringDown
        expr: up{job="stream-monitoring"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Stream monitoring service is down"
          description: "Stream monitoring service has been unreachable for more than 2 minutes"

  - name: application
    rules:
      # No chat messages being processed when streams are active
      #
      # sum() strips the broadcaster_id label from chat_messages_total, and
      # `on()` (empty) makes the `and` a plain boolean match ignoring any
      # remaining labels (active_stream_count still carries instance/job).
      # Without both, this could never fire: Prometheus's `and` requires
      # identical label sets on both sides by default. Verified via direct
      # query against a real incident window where the condition was true for
      # 2+ hours and the original (unfixed) version matched zero series.
      - alert: NoChatMessagesProcessed
        expr: sum(rate(chat_messages_total[5m])) == 0 and on() active_stream_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No chat messages being processed"
          description: "No chat messages processed in the last 5 minutes despite {{ $value }} active streams"

      # Clip creation failure spike
      - alert: ClipCreationFailureSpike
        expr: |
          (
            sum(increase(clips_created_failed_total[1h])) /
            (sum(increase(clips_created_success_total[1h])) + sum(increase(clips_created_failed_total[1h])) + 0.001)
          ) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High clip creation failure rate"
          description: "Clip creation failure rate is {{ $value | printf \"%.1f\" }}% in the last hour (threshold: 30%)"

      # Anomaly detection stalled, system-wide
      #
      # A per-broadcaster or percent-of-broadcasters version of this check
      # can't work: zero anomalies for one broadcaster (or even many) is
      # normal on a quiet stream, not a sign of a broken detector. Only a
      # true fleet-wide zero is a meaningful signal, since it's very
      # unlikely every broadcaster goes quiet at once by chance.
      #
      # Gated on chat actually flowing (not active_stream_count): chat
      # ingestion is a separate service (stream-monitoring) from the Flink
      # detector, so chat can keep flowing while Flink itself hangs
      # internally. Requiring chat > 0 here catches that silent-Flink-stall
      # case, which neither NoChatMessagesProcessed (upstream ingestion
      # only) nor ClipDetectorMetricsDown (whole-process death only) can see.
      #
      # `and on()`: sum() strips all labels from both sides, so on() forces
      # a plain boolean match. Same fix as NoChatMessagesProcessed above.
      - alert: AnomalyDetectionStalled
        expr: |
          sum(increase(anomalies_detected_total[24h])) == 0
          and on() sum(rate(chat_messages_total[5m])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No anomalies detected fleet-wide in 24 hours"
          description: "Zero anomalies detected across all broadcasters in the last 24 hours despite chat actively flowing in. Check the Flink clip-detector job."

      # No clips created in 24 hours, system-wide
      #
      # Global by design: fires only when at least half of the broadcasters
      # that had anomalies in the last 24h produced zero successful clips,
      # not when a single broadcaster is stuck. This also makes the alert
      # naturally immune to one stale/ghost broadcaster series (e.g. after
      # a Flink restart drops a broadcaster mid-stream) as long as the rest
      # of the fleet is still producing clips normally.
      - alert: NoClipsCreated
        expr: |
          (
            count(increase(clips_created_success_total[24h]) == 0 and increase(anomalies_detected_total[24h]) > 0)
            /
            count(increase(anomalies_detected_total[24h]) > 0)
          ) * 100 >= 50
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No clips created for half or more of broadcasters with anomalies"
          description: "{{ $value | printf \"%.0f\" }}% of broadcasters with anomalies in the last 24 hours have produced zero successful clips. Check Twitch API or token status."

      # Clip detector metrics endpoint down
      - alert: ClipDetectorMetricsDown
        expr: up{job="clip-detector"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clip detector metrics endpoint is down"
          description: "Clip detector Prometheus metrics endpoint has been unreachable for more than 5 minutes"
