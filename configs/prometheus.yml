global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'stream-monitoring'
    static_configs:
      - targets: ['stream-monitoring:9100']
    metrics_path: /metrics

  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:9249']

  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:9249']

  - job_name: 'clip-detector'
    # One target per parallel subtask (FLINK_PARALLELISM / taskmanager.numberOfTaskSlots):
    # each subtask binds its own metrics port at 9250 + subtask_index, since they can't
    # all share one HTTP server across separate worker processes.
    static_configs:
      - targets:
          - 'flink-taskmanager:9250'
          - 'flink-taskmanager:9251'
          - 'flink-taskmanager:9252'
          - 'flink-taskmanager:9253'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
