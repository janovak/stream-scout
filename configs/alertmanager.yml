global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord'

  routes:
    - match:
        severity: critical
      receiver: 'discord'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'discord'
    discord_configs:
      # Real webhook URL lives in ./secrets/alertmanager.yml (gitignored) and is
      # mounted over this file via docker-compose.override.yml. Create a webhook
      # in Discord (Server Settings > Integrations > Webhooks) and paste the URL
      # into secrets/alertmanager.yml — never commit a live webhook URL here.
      - webhook_url: 'REPLACE_WITH_DISCORD_WEBHOOK_URL'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
